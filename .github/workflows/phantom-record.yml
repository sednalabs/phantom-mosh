name: Phantom record tests

on:
  pull_request:
  push:
    branches: [master, 'feat/phantom-*']

permissions:
  contents: read

concurrency:
  group: phantom-record-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: record-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            compiler: g++
            build_type: Release
            sanitizers: 'OFF'
          - name: clang-sanitizers
            compiler: clang++
            build_type: Debug
            sanitizers: 'ON'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang libssl-dev python3 openssh-client openssh-server
          sudo mkdir -p /run/sshd
      - name: Record tested revision and toolchain
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          git cat-file -p HEAD | sed -n '1,/^$/p' > test-results/commit-headers.txt
          { cmake --version; ${{ matrix.compiler }} --version; openssl version -a; python3 --version; } > test-results/toolchain.txt
      - name: Configure
        run: >-
          cmake -S src/phantom -B build/phantom
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPHANTOM_SANITIZERS=${{ matrix.sanitizers }}
          -DPHANTOM_REQUIRE_SSH_TESTS=ON
      - name: Build
        run: cmake --build build/phantom --parallel 2
      - name: Test
        run: |
          ctest --test-dir build/phantom --output-on-failure --output-junit "$PWD/test-results/ctest.xml"
          git diff --exit-code HEAD
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phantom-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            build/phantom/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 14

  formatting:
    name: record-format-14
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-format-14
      - name: Check formatting
        run: |
          find src/phantom tests/phantom -type f \( -name '*.cc' -o -name '*.h' \) \
            -exec clang-format-14 -i {} +
          git diff --exit-code

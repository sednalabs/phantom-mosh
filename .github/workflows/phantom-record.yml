name: Phantom record contract

on:
  pull_request:
  push:
    branches: [master, 'feat/phantom-*']

permissions:
  contents: read

concurrency:
  group: phantom-record-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: record-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            compiler: g++
            build_type: Release
            sanitizers: 'OFF'
          - name: clang-sanitizers
            compiler: clang++
            build_type: Debug
            sanitizers: 'ON'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang libssl-dev python3
      - name: Bind evidence to actual checkout
        run: |
          python3 engineering/capture_generation.py build-evidence/generation.json
          { cmake --version; ${{ matrix.compiler }} --version; openssl version -a; python3 --version; } > build-evidence/toolchain.txt
      - name: Configure
        run: >-
          cmake -S src/phantom -B build/phantom
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPHANTOM_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build/phantom --parallel 2
      - name: Test records, UDP and evaluation guards
        run: |
          ctest --test-dir build/phantom --output-on-failure --output-junit "$PWD/build-evidence/ctest.xml"
          git diff --exit-code HEAD
      - name: Retain exact-generation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phantom-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-evidence/
            build/phantom/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 14

  formatting:
    name: record-format-14
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-format-14
      - name: Check inherited style, including new tests
        run: |
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/formatter-input-sha.txt
          git archive --format=tar HEAD > build-evidence/source.tar
          clang-format-14 -i src/phantom/*.cc src/phantom/*.h tests/phantom/*.cc
          git diff --binary > build-evidence/formatting.patch
          tar -cf build-evidence/formatted.tar src/phantom tests/phantom .clang-format
          git diff --exit-code
      - name: Retain formatter diagnostic, not tested-source evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phantom-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-evidence/
          if-no-files-found: warn
          retention-days: 14

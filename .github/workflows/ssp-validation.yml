name: SSP integration validation
on:
  push:
    branches: ['feat/phantom-ssp-integration']
permissions:
  contents: read
jobs:
  prerequisites:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install integration prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libncurses-dev clang-format-14
      - name: Capture reproducible integration prerequisites
        run: |
          mkdir snapshot
          dpkg-query -W protobuf-compiler libprotobuf-dev libncurses-dev clang-format-14 > snapshot/packages.txt
          python3 - <<'PY'
          import glob, tarfile
          paths = ['/usr/bin/protoc', '/usr/include/google/protobuf', '/usr/include/ncursesw', '/usr/include/curses.h', '/usr/include/ncurses.h', '/usr/include/term.h', '/usr/include/unctrl.h', '/usr/include/ncurses_dll.h', '/usr/lib/llvm-14/bin/clang-format']
          for pattern in ('/usr/lib/x86_64-linux-gnu/libprotobuf*.so*', '/usr/lib/x86_64-linux-gnu/libprotoc.so*', '/usr/lib/x86_64-linux-gnu/libclang-cpp.so.14*', '/usr/lib/x86_64-linux-gnu/libLLVM-14.so*'):
              paths.extend(glob.glob(pattern))
          with tarfile.open('snapshot/tools.tar', 'w', dereference=True) as archive:
              for path in sorted(set(paths)):
                  archive.add(path, arcname=path.lstrip('/'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-prerequisites
          path: snapshot/
          retention-days: 1

name: Standard public runner policy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runners:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Validate runner policy and its negative tests
        run: |
          /usr/bin/python3 tools/check_runners.py
          /usr/bin/python3 -m unittest discover -s tests/ci

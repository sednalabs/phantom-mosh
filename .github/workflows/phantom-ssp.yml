name: Phantom SSP integration

on:
  pull_request:
  push:
    branches: [master, 'feat/phantom-ssp*']

permissions:
  contents: read

concurrency:
  group: phantom-ssp-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssp:
    name: ssp-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cc: gcc
            cxx: g++
            type: Release
            sanitizers: 'OFF'
          - name: clang-sanitizers
            cc: clang
            cxx: clang++
            type: Debug
            sanitizers: 'ON'
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build and integration-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake g++ clang pkg-config \
            libssl-dev libncurses-dev libprotobuf-dev protobuf-compiler zlib1g-dev \
            python3 openssh-client openssh-server
          sudo mkdir -p /run/sshd
      - name: Record the actual tested checkout
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          git cat-file -p HEAD | sed -n '1,/^$/p' > test-results/commit-headers.txt
          { "$CXX" --version; protoc --version; openssl version; } > test-results/toolchain.txt
      - name: Build the inherited state engine with the same instrumentation
        run: |
          if [ '${{ matrix.sanitizers }}' = ON ]; then
            export CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
            export CXXFLAGS="$CFLAGS"
            export LDFLAGS='-fsanitize=address,undefined'
          fi
          ./autogen.sh
          ./configure --with-crypto-library=openssl --without-utempter
          make -j2
      - name: Build the SSP connection and convergence tests
        run: |
          cmake -S src/phantom -B build/ssp \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
            -DPHANTOM_SANITIZERS=${{ matrix.sanitizers }} \
            -DPHANTOM_REQUIRE_SSH_TESTS=ON \
            -DPHANTOM_BUILD_SSP=ON -DPHANTOM_MOSH_BUILD_DIR="$PWD"
          cmake --build build/ssp --parallel 2
      - name: Test component regressions and actual terminal-state convergence
        run: |
          ctest --test-dir build/ssp --output-on-failure --output-junit "$PWD/test-results/ctest.xml"
          git diff --exit-code HEAD
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phantom-ssp-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            build/ssp/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 14
